version: '2.4'

x-billing-service: &billing-service
  image: nuvex-billing-service:${IMAGE_TAG:-latest}
  build:
    context: .
    dockerfile: Dockerfile
  env_file:
    - .env
  environment:
    NODE_ENV: production
    API_HOST: 0.0.0.0
    API_PORT: 3100
    DATABASE_URL: postgresql://${POSTGRES_USER:-nuvex_billing}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD requerido}@postgres:5432/${POSTGRES_DB:-nuvex_billing}?schema=public
    TZ: America/Lima
  networks:
    - billing-network

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nuvex_billing}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD requerido}
      POSTGRES_DB: ${POSTGRES_DB:-nuvex_billing}
    expose:
      - '5432'
    volumes:
      - billing-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - billing-network

  api:
    <<: *billing-service
    restart: unless-stopped
    command:
      - sh
      - -c
      - npx prisma migrate deploy && node --enable-source-maps dist/apps/api/apps/api/src/main.js
    ports:
      - '127.0.0.1:${API_PUBLISHED_PORT:-3100}:3100'
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - curl
        - --fail
        - --silent
        - http://127.0.0.1:3100/v1/health
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  worker:
    <<: *billing-service
    restart: unless-stopped
    command:
      - node
      - --enable-source-maps
      - dist/apps/worker/apps/worker/src/main.js
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      disable: true

volumes:
  billing-postgres-data:

networks:
  billing-network:
    driver: bridge
